name: Build & publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild so "latest" Node / Go / opencode stay fresh.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version (e.g. v24.20.0) or latest"
        default: latest
      go_version:
        description: "Go version (e.g. go1.27.1) or latest"
        default: latest
      opencode_version:
        description: "opencode version (e.g. 1.18.26) or latest"
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_NAME: opencode
  CHART_DIR: charts/opencode

jobs:
  # ---------------------------------------------------------------------------
  # Container image -> ghcr.io/<owner>/<repo>
  # ---------------------------------------------------------------------------
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      push: ${{ steps.flags.outputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.flags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.flags.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=opencode-workstation
            org.opencontainers.image.description=opencode server on Debian with build-essential, git, Go, Node.js and yarn

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.flags.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ inputs.node_version || 'latest' }}
            GO_VERSION=${{ inputs.go_version || 'latest' }}
            OPENCODE_VERSION=${{ inputs.opencode_version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # GitHub artifact attestations are not available for private user-owned
      # repositories; do not fail the build (the image is already pushed).
      - name: Attest build provenance
        if: steps.flags.outputs.push == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.flags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Helm chart -> oci://ghcr.io/<owner>/charts/opencode
  # ---------------------------------------------------------------------------
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Compute versions
        id: ver
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # v1.2.3 -> chart 1.2.3, app 1.2.3
            v="${GITHUB_REF#refs/tags/v}"
            echo "chart=${v}" >> "$GITHUB_OUTPUT"
            echo "app=${v}" >> "$GITHUB_OUTPUT"
          else
            # non-release builds get a pre-release chart version that tracks the image tag
            base="$(grep '^version:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}')"
            echo "chart=${base}-${{ needs.image.outputs.version }}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "app=${{ needs.image.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: |
          helm lint "${CHART_DIR}" --strict
          helm template test "${CHART_DIR}" \
            --set secrets.openrouterApiKey=dummy \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=opencode.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set ssh.existingSecret=opencode-ssh \
            --set sshServer.enabled=true \
            --set 'sshServer.authorizedKeys[0]=ssh-ed25519 AAAA lint@example' \
            --set config.enabled=true > /dev/null

      - name: Package
        run: |
          # Bake the default image repository so the chart works with no overrides.
          sed -i "s#^  repository: .*#  repository: ${{ steps.ver.outputs.image }}#" "${CHART_DIR}/values.yaml"
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${{ steps.ver.outputs.chart }}" \
            --app-version "${{ steps.ver.outputs.app }}"
          ls -l dist

      - name: Log in to GHCR (helm)
        if: needs.image.outputs.push == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        if: needs.image.outputs.push == 'true'
        run: |
          helm push dist/${CHART_NAME}-${{ steps.ver.outputs.chart }}.tgz \
            "oci://${REGISTRY}/${{ steps.ver.outputs.owner }}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
