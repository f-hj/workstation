apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.openclient.enabled }}
    {{- if .Values.openclient.bridge.service }}
    # OpenClient bridge (WebSocket, unauthenticated): the iOS app looks for it on
    # the host it reaches opencode at, so it shares this Service.
    - port: {{ .Values.openclient.bridge.port }}
      targetPort: openclient
      protocol: TCP
      name: openclient
    {{- end }}
    {{- if .Values.openclient.notify.enabled }}
    - port: {{ .Values.openclient.notify.listenPort }}
      targetPort: oc-notify
      protocol: TCP
      name: oc-notify
    {{- end }}
    {{- end }}
  selector:
    {{- include "opencode.selectorLabels" . | nindent 4 }}
