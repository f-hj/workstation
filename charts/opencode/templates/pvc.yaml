{{- $claims := dict }}
{{- range $name, $pvc := .Values.persistence }}{{- $_ := set $claims $name $pvc }}{{- end }}
{{- if .Values.docker.enabled }}{{- $_ := set $claims "docker" .Values.docker.persistence }}{{- end }}
{{- range $name, $pvc := $claims }}
{{- if and $pvc.enabled (not $pvc.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode.fullname" $ }}-{{ $name }}
  labels:
    {{- include "opencode.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  accessModes:
    {{- toYaml $pvc.accessModes | nindent 4 }}
  {{- if $pvc.storageClass }}
  storageClassName: {{ $pvc.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pvc.size }}
{{- end }}
{{- end }}
