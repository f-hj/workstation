{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.openrouterApiKey }}
  {{ include "opencode.apiKeyEnv" $ }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.serverPassword }}
  OPENCODE_SERVER_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
