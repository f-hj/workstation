apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "opencode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "opencode.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if or .Values.image.pullSecret .Values.imagePullSecrets .Values.imageCredentials.create }}
      imagePullSecrets:
        {{- with .Values.image.pullSecret }}
        - name: {{ . }}
        {{- end }}
        {{- if .Values.imageCredentials.create }}
        - name: {{ include "opencode.imagePullSecretName" . }}
        {{- end }}
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "opencode.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No FOO_SERVICE_HOST / FOO_PORT_* variables for every Service in the namespace.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: opencode
          image: {{ include "opencode.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.opencode.port }}
              protocol: TCP
            {{- if .Values.sshServer.enabled }}
            - name: ssh
              containerPort: {{ .Values.sshServer.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: OPENCODE_HOST
              value: "0.0.0.0"
            - name: OPENCODE_PORT
              value: {{ .Values.opencode.port | quote }}
            - name: OPENCODE_PROVIDER
              value: {{ .Values.opencode.provider | quote }}
            - name: OPENCODE_PROVIDER_API_KEY_ENV
              value: {{ include "opencode.apiKeyEnv" . | quote }}
            {{- with .Values.opencode.model }}
            - name: OPENCODE_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.opencode.smallModel }}
            - name: OPENCODE_SMALL_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.opencode.baseURL }}
            - name: OPENCODE_PROVIDER_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.opencode.cors }}
            - name: OPENCODE_CORS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.opencode.serverUsername }}
            - name: OPENCODE_SERVER_USERNAME
              value: {{ . | quote }}
            {{- end }}
            - name: OPENCODE_SCRUB_ENV
              value: {{ .Values.opencode.scrubEnv | quote }}
            {{- with .Values.opencode.keepEnv }}
            - name: OPENCODE_KEEP_ENV
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with .Values.opencode.secretFiles }}
            - name: OPENCODE_SECRET_FILES
              value: {{ join " " . | quote }}
            {{- end }}
            {{- with .Values.opencode.extraConfig }}
            - name: OPENCODE_EXTRA_CONFIG_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.git.userName }}
            - name: GIT_USER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.git.userEmail }}
            - name: GIT_USER_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- if include "opencode.gitSshEnabled" . }}
            - name: GIT_SSH_KEY_FILE
              value: /secrets/ssh/{{ .Values.ssh.key }}
            {{- end }}
            {{- with .Values.drone.server }}
            - name: DRONE_SERVER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.docker.enabled }}
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
            {{- end }}
            {{- if .Values.sshServer.enabled }}
            - name: SSH_SERVER_PORT
              value: {{ .Values.sshServer.port | quote }}
            {{- if .Values.sshServer.existingSecret }}
            - name: SSH_AUTHORIZED_KEYS_FILE
              value: /secrets/ssh-server/{{ .Values.sshServer.existingSecretKey }}
            {{- else }}
            - name: SSH_AUTHORIZED_KEYS
              value: {{ join "\n" .Values.sshServer.authorizedKeys | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "opencode.secretName" . }}
                optional: true
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.persistence.workspace.mountPath }}
            {{- end }}
            {{- if .Values.persistence.home.enabled }}
            - name: home
              mountPath: {{ .Values.persistence.home.mountPath }}
            {{- end }}
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: /home/dev/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
            {{- end }}
            {{- if include "opencode.gitSshEnabled" . }}
            - name: ssh
              mountPath: /secrets/ssh
              readOnly: true
            {{- end }}
            {{- if and .Values.sshServer.enabled .Values.sshServer.existingSecret }}
            - name: ssh-server
              mountPath: /secrets/ssh-server
              readOnly: true
            {{- end }}
            {{- if .Values.docker.enabled }}
            - name: docker-sock
              mountPath: /run/docker
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.docker.enabled }}
        # Docker daemon. Passing "dockerd" as the first argument makes the image
        # entrypoint skip its default tcp://0.0.0.0 listener; only the shared
        # Unix socket is exposed, group-owned by the workstation user.
        - name: dind
          image: "{{ .Values.docker.image.repository }}:{{ .Values.docker.image.tag }}"
          imagePullPolicy: {{ .Values.docker.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          command: ["dockerd-entrypoint.sh"]
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group={{ .Values.podSecurityContext.runAsGroup | default 1000 }}
            {{- range .Values.docker.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          readinessProbe:
            exec:
              command: ["docker", "version", "--format", "{{ "{{" }}.Server.Version{{ "}}" }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["docker", "version", "--format", "{{ "{{" }}.Server.Version{{ "}}" }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.docker.resources | nindent 12 }}
          volumeMounts:
            - name: docker-sock
              mountPath: /run/docker
            - name: docker-data
              mountPath: /var/lib/docker
            # Same paths as the workstation so `docker run -v /workspace/...` bind mounts work.
            {{- if .Values.persistence.workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.persistence.workspace.mountPath }}
            {{- end }}
            {{- if .Values.persistence.home.enabled }}
            - name: home
              mountPath: {{ .Values.persistence.home.mountPath }}
            {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.docker.enabled }}
        - name: docker-sock
          emptyDir: {}
        - name: docker-data
          {{- if .Values.docker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-docker" (include "opencode.fullname" .)) .Values.docker.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.persistence.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" (include "opencode.fullname" .)) .Values.persistence.workspace.existingClaim }}
        {{- end }}
        {{- if .Values.persistence.home.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-home" (include "opencode.fullname" .)) .Values.persistence.home.existingClaim }}
        {{- end }}
        {{- if .Values.config.enabled }}
        - name: config
          configMap:
            name: {{ include "opencode.fullname" . }}
        {{- end }}
        {{- if include "opencode.gitSshEnabled" . }}
        - name: ssh
          secret:
            secretName: {{ include "opencode.gitSshSecretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- if and .Values.sshServer.enabled .Values.sshServer.existingSecret }}
        - name: ssh-server
          secret:
            secretName: {{ .Values.sshServer.existingSecret }}
            defaultMode: 0444
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
