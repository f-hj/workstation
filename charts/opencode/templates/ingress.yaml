{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- $tls := $ing.tls }}
{{- $tlsSecret := $tls.secretName | default (printf "%s-tls" (include "opencode.fullname" .)) }}
{{- $annotations := dict }}
{{- if $tls.enabled }}
  {{- if $tls.clusterIssuer }}
    {{- $_ := set $annotations "cert-manager.io/cluster-issuer" $tls.clusterIssuer }}
  {{- else if $tls.issuer }}
    {{- $_ := set $annotations "cert-manager.io/issuer" $tls.issuer }}
  {{- end }}
  {{- if $ing.forceHttps }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/ssl-redirect" "true" }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "true" }}
    {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.entrypoints" "websecure" }}
    {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.tls" "true" }}
  {{- end }}
{{- end }}
{{- $annotations = merge (deepCopy ($ing.annotations | default dict)) $annotations }}
{{- /* OC Notify web app host, derived from openclient.notify.publicOrigin (https://host[:port]). */}}
{{- $oc := .Values.openclient }}
{{- $notifyHost := "" }}
{{- if and $oc.enabled $oc.notify.enabled $oc.notify.ingress.enabled $oc.notify.publicOrigin }}
  {{- $notifyHost = $oc.notify.publicOrigin | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
  {{- $notifyHost = (splitList ":" $notifyHost) | first }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opencode.fullname" . }}
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if or $tls.enabled $tls.extra }}
  tls:
    {{- if $tls.enabled }}
    - hosts:
        {{- range $ing.hosts }}
        - {{ .host | quote }}
        {{- end }}
        {{- if $notifyHost }}
        - {{ $notifyHost | quote }}
        {{- end }}
      secretName: {{ $tlsSecret }}
    {{- end }}
    {{- range $tls.extra }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    {{- /* Lists are replaced, not merged, by Helm: a host given without paths gets "/" Prefix. */}}
    {{- $paths := .paths | default (list (dict "path" "/" "pathType" "Prefix")) }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "opencode.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
    {{- if $notifyHost }}
    # OC Notify web app (Web Push needs HTTPS; the plugin checks the Host header
    # against publicOrigin, which ingress-nginx and Traefik pass through).
    - host: {{ $notifyHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opencode.fullname" . }}
                port:
                  name: oc-notify
    {{- end }}
{{- end }}
